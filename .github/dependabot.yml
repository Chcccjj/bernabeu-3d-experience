version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      compatible-updates:
        update-types: [minor, patch]
    commit-message:
      prefix: 'chore(deps)'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'chore(ci)'
  - package-ecosystem: npm
    directory: /plugins/stadium-architect-3d/assets/starter-v1
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    groups:
      plugin-compatible-updates:
        update-types: [minor, patch]
    commit-message:
      prefix: 'chore(plugin-deps)'
