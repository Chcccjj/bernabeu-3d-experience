name: Bug report / 问题反馈
description: Report a reproducible problem with the stadium experience.
body:
  - type: markdown
    attributes:
      value: 'Please do not include passwords, tokens, private links, or personal data. 请勿填写密钥或个人隐私。'
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Include the view, mode, and action that triggered the problem.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result / 预期与实际结果
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, device, and version / 浏览器、设备与版本
      placeholder: 'Chrome on macOS; online or offline HTML; v2.2.1'
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot or console error / 截图或控制台报错
