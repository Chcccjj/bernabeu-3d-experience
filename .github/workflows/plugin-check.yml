name: Plugin checks
on:
  pull_request:
    paths:
      - 'plugins/stadium-architect-3d/**'
      - '.github/workflows/plugin-check.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/stadium-architect-3d/**'
      - '.github/workflows/plugin-check.yml'
permissions:
  contents: read
jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/stadium-architect-3d/assets/starter-v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugins/stadium-architect-3d/assets/starter-v1/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
