name: Plugin checks
on:
  pull_request:
    paths:
      - 'plugins/stadium-architect-3d/**'
      - '.github/workflows/plugin-check.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/stadium-architect-3d/**'
      - '.github/workflows/plugin-check.yml'
permissions:
  contents: read
jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/stadium-architect-3d/assets/starter-v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugins/stadium-architect-3d/assets/starter-v1/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
